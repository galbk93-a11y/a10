<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שטח בעזרת אינטגרל – תרגול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f3; --gridline:#dde1e7; --card:#ffffff; --text:#1f2430; --muted:#5d6574; --line:#d3d8e0;
  --ink:#d6336c; --accent:#7048e8; --accent-soft:rgba(151,117,250,.28); --curve:#e03131;
  --ok:#2b8a3e; --ok-bg:#ebfbee; --bad:#c92a2a; --bad-bg:#fff5f5; --grid:#e9ecf1; --axis:#3b4252; --curve2:#1971c2; --neg-soft:rgba(224,49,49,.22);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181d; --gridline:#22252d; --card:#1f222a; --text:#e9ebf0; --muted:#a5abb8; --line:#343946;
    --ink:#f783ac; --accent:#b197fc; --accent-soft:rgba(177,151,252,.28); --curve:#ff8787;
    --ok:#8ce99a; --ok-bg:#1d3326; --bad:#ffa8a8; --bad-bg:#3a1f23; --grid:#2a2e37; --axis:#c1c6d2; --curve2:#74c0fc; --neg-soft:rgba(255,135,135,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg:#16181d; --gridline:#22252d; --card:#1f222a; --text:#e9ebf0; --muted:#a5abb8; --line:#343946;
    --ink:#f783ac; --accent:#b197fc; --accent-soft:rgba(177,151,252,.28); --curve:#ff8787;
    --ok:#8ce99a; --ok-bg:#1d3326; --bad:#ffa8a8; --bad-bg:#3a1f23; --grid:#2a2e37; --axis:#c1c6d2; --curve2:#74c0fc; --neg-soft:rgba(255,135,135,.25);
    color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:"Rubik","Assistant","Arial Hebrew",Arial,sans-serif;
  background-color:var(--bg);
  background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);
  background-size:22px 22px;padding:0 12px}
header{max-width:760px;margin:0 auto;padding:22px 4px 4px}
h1{font-size:1.6rem;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0;font-size:.98rem}
.tabs{max-width:760px;margin:14px auto;display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:10px;font:inherit;font-size:.92rem;cursor:pointer}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:760px;margin:0 auto 40px}
.rule{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.rule b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:1.05rem;font-weight:500;color:var(--muted)}
.fx{font-size:1.3rem;margin:6px 0 10px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 2px;line-height:1.15}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.lim{display:inline-flex;flex-direction:column;font-size:.62em;vertical-align:middle;line-height:1.2;margin:0 2px}
.int{font-size:1.25em}
.hl{background:var(--accent-soft);border-radius:4px;padding:0 3px}
svg{direction:ltr;width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
input{flex:1;min-width:120px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:1rem;direction:ltr;text-align:left}
button.b{padding:9px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-size:.95rem;cursor:pointer}
button.g{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.fb{margin-top:8px;padding:8px 10px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-bg);color:var(--bad)}
.hint,.sol{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line)}
.sol ol{margin:0;padding-inline-start:20px}
.sol li{margin:6px 0;line-height:1.95}
.ans{font-weight:700;color:var(--ink)}
.secs{max-width:760px;margin:14px auto 0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sec{border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:10px 8px;border-radius:12px;font:inherit;font-weight:700;font-size:.98rem;cursor:pointer}
.sec.active{background:var(--ink);color:#fff}
.fin{display:none;margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--bg);border:1.5px solid var(--ink)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <h1 id="ttl"></h1>
  <p class="sub">כיתה יא, 5 יח"ל. שרטטו, מצאו נקודות חיתוך, ורק אז חשבו את האינטגרל.</p>
</header>
<nav class="secs" id="secs"></nav>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<script>
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const M=s=>`<span class="m">${s}</span>`;
const HL=s=>`<span class="hl">${s}</span>`;
const lim=(a,b)=>`<span class="lim"><span>${b}</span><span>${a}</span></span>`;
const I=(a,b)=>`<span class="int">∫${lim(a,b)}</span>`;
const EV=(e,a,b)=>`[ ${e} ]${lim(a,b)}`;
const H='½';

const ABOVE=[
 {name:'כלל 1: חזקה',
  rule:`${M(`∫ ${fr('a','b')}·x<sup>n</sup> dx = ${fr('a·x<sup>n+1</sup>','b(n+1)')} + C`)} &nbsp; גם עבור n שלילי, למשל ${M(`${fr('4','x<sup>2</sup>')} = 4x<sup>−2</sup>`)}`,
  ex:[
  {f:x=>x*x/3, fx:fr('x<sup>2</sup>','3'), q:'חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x והישר x = 3.',
   a:0,b:3, v:[-1,4,-1,4], val:3, ans:'3',
   s:[`בתחום ${M('0 ≤ x ≤ 3')} הגרף מעל ציר ה‑x, ולכן השטח שווה לאינטגרל.`,
      `${M(`S = ${I(0,3)} ${fr('x<sup>2</sup>','3')} dx`)}`,
      `לפי כלל 1 (a = 1, b = 3, n = 2): ${M(`∫ ${fr('x<sup>2</sup>','3')} dx = ${fr('x<sup>3</sup>','3·3')} = ${fr('x<sup>3</sup>','9')}`)}`,
      `${M(`S = ${EV(fr('x<sup>3</sup>','9'),0,3)} = ${fr('27','9')} − 0 = 3`)}`]},
  {f:x=>4/(x*x), fx:fr('4','x<sup>2</sup>'), q:'חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x והישרים x = 1 ו‑x = 2.',
   a:1,b:2, v:[0,3,-1,6], val:2, ans:'2',
   s:[`נכתוב כחזקה שלילית: ${M(`${fr('4','x<sup>2</sup>')} = 4x<sup>−2</sup>`)}`,
      `לפי כלל 1 עם n = −2: ${M(`∫ 4x<sup>−2</sup> dx = ${fr('4x<sup>−1</sup>','−1')} = −${fr('4','x')}`)}`,
      `${M(`S = ${EV('−'+fr('4','x'),1,2)} = −2 − (−4) = 2`)}`]},
  {f:x=>12-3*x*x, fx:'12 − 3x<sup>2</sup>', q:'חשבו את השטח המוגבל על ידי גרף הפונקציה וציר ה‑x.',
   a:-2,b:2, v:[-3,3,-3,14], val:32, ans:'32',
   s:[`חיתוך עם ציר ה‑x: ${M('12 − 3x<sup>2</sup> = 0 ⇒ x = ±2')}. בתחום הגרף מעל ציר ה‑x.`,
      `פונקציה קדומה לפי כלל 1: ${M('12x − x<sup>3</sup>')}`,
      `${M(`S = (24 − 8) − (−24 + 8) = 16 + 16 = 32`)}`]},
  {f:x=>8/(x*x*x)-1, fx:`${fr('8','x<sup>3</sup>')} − 1`, q:'חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x והישר x = 1.',
   a:1,b:2, v:[0,4,-2,8], val:2, ans:'2',
   s:[`חיתוך עם ציר ה‑x: ${M(`${fr('8','x<sup>3</sup>')} = 1 ⇒ x<sup>3</sup> = 8 ⇒ x = 2`)}. בתחום ${M('1 ≤ x ≤ 2')} הגרף מעל הציר.`,
      `${M(`${fr('8','x<sup>3</sup>')} = 8x<sup>−3</sup>`)}, ולפי כלל 1: ${M(`∫ 8x<sup>−3</sup> dx = ${fr('8x<sup>−2</sup>','−2')} = −${fr('4','x<sup>2</sup>')}`)}`,
      `פונקציה קדומה: ${M(`−${fr('4','x<sup>2</sup>')} − x`)}`,
      `${M(`S = (−1 − 2) − (−4 − 1) = −3 + 5 = 2`)}`]},
  {f:x=>3*x*x, fx:'3x<sup>2</sup>', q:'חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x והישרים x = −1 ו‑x = 2.',
   a:-1,b:2, v:[-1.5,2.5,-1,13], val:9, ans:'9', marks:[[0,'0']],
   s:[`הגרף נוגע בציר ה‑x ב‑${M('x = 0')}, ולכן השטח בנוי משני חלקים. שניהם מעל הציר, ולכן אפשר לחשב באינטגרל אחד.`,
      `פונקציה קדומה לפי כלל 1: ${M('x<sup>3</sup>')}`,
      `${M(`S = ${EV('x<sup>3</sup>',-1,2)} = 8 − (−1) = 9`)}`]}
 ]},
 {name:`כלל 2: ${M('(mx + b)<sup>n</sup>')}`,
  rule:`${M(`∫ ${fr('a','b')}(mx+b)<sup>n</sup> dx = ${fr('a(mx+b)<sup>n+1</sup>','b·m(n+1)')} + C`)} &nbsp; גם עבור n שלילי`,
  ex:[
  {f:x=>3*(x-2)**2, fx:'3(x − 2)<sup>2</sup>', q:'חשבו את השטח המוגבל על ידי גרף הפונקציה ושני הצירים.',
   a:0,b:2, v:[-1,4,-1,13], val:8, ans:'8',
   s:[`הגרף משיק לציר ה‑x ב‑${M('x = 2')}, ובתחום ${M('0 ≤ x ≤ 2')} הוא מעל הציר.`,
      `לפי כלל 2 (a = 3, m = 1, n = 2): ${M(`∫ 3(x − 2)<sup>2</sup> dx = ${fr('3(x − 2)<sup>3</sup>','1·3')} = (x − 2)<sup>3</sup>`)}`,
      `${M(`S = ${EV('(x − 2)<sup>3</sup>',0,2)} = 0 − (−8) = 8`)}`]},
  {f:x=>6/(2*x+1)**2, fx:fr('6','(2x + 1)<sup>2</sup>'), q:'חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x, ציר ה‑y והישר x = 1.',
   a:0,b:1, v:[-0.4,2.5,-1,7], val:2, ans:'2',
   s:[`${M(`${fr('6','(2x + 1)<sup>2</sup>')} = 6(2x + 1)<sup>−2</sup>`)}`,
      `לפי כלל 2 (a = 6, m = 2, n = −2): ${M(`${fr('6(2x + 1)<sup>−1</sup>','2·(−1)')} = −${fr('3','2x + 1')}`)}`,
      `${M(`S = ${EV('−'+fr('3','2x + 1'),0,1)} = −1 − (−3) = 2`)}`]},
  {f:x=>(3-x)**3, fx:'(3 − x)<sup>3</sup>', q:'חשבו את השטח המוגבל על ידי גרף הפונקציה ושני הצירים.',
   a:0,b:3, v:[-1,4.5,-4,28], val:81/4, ans:'81/4',
   s:[`חיתוך עם ציר ה‑x ב‑${M('x = 3')}. בתחום ${M('0 ≤ x ≤ 3')} הגרף מעל הציר (${M('f(0) = 27')}).`,
      `${M('(3 − x)<sup>3</sup> = (−x + 3)<sup>3</sup>')}, ולפי כלל 2 (m = −1, n = 3): ${M(`${fr('(−x + 3)<sup>4</sup>','(−1)·4')} = −${fr('(3 − x)<sup>4</sup>','4')}`)}`,
      `${M(`S = 0 − (−${fr('81','4')}) = ${fr('81','4')}`)}`]},
  {f:x=>4/(x+1)**2-1, fx:`${fr('4','(x + 1)<sup>2</sup>')} − 1`, q:'חשבו את השטח המוגבל על ידי גרף הפונקציה ושני הצירים.',
   a:0,b:1, v:[-0.5,4,-1.5,4], val:1, ans:'1',
   s:[`חיתוך עם ציר ה‑x: ${M('(x + 1)<sup>2</sup> = 4 ⇒ x = 1')} (הפתרון ${M('x = −3')} מחוץ לתחום). בתחום ${M('0 ≤ x ≤ 1')} הגרף מעל הציר.`,
      `${M(`${fr('4','(x + 1)<sup>2</sup>')} = 4(x + 1)<sup>−2</sup>`)}, ולפי כלל 2: ${M(`${fr('4(x + 1)<sup>−1</sup>','1·(−1)')} = −${fr('4','x + 1')}`)}`,
      `פונקציה קדומה: ${M(`−${fr('4','x + 1')} − x`)}`,
      `${M(`S = (−2 − 1) − (−4 − 0) = 1`)}`]},
  {f:x=>4/(2*x-1)**3, fx:fr('4','(2x − 1)<sup>3</sup>'), q:'חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x והישרים x = 1 ו‑x = 2.',
   a:1,b:2, v:[0.6,3,-0.5,5], val:8/9, ans:'8/9',
   s:[`${M(`${fr('4','(2x − 1)<sup>3</sup>')} = 4(2x − 1)<sup>−3</sup>`)}`,
      `לפי כלל 2 (a = 4, m = 2, n = −3): ${M(`${fr('4(2x − 1)<sup>−2</sup>','2·(−2)')} = −${fr('1','(2x − 1)<sup>2</sup>')}`)}`,
      `${M(`S = ${EV('−'+fr('1','(2x − 1)<sup>2</sup>'),1,2)} = −${fr('1','9')} + 1 = ${fr('8','9')}`)}`]}
 ]},
 {name:`כלל 3א: ${M('f′·f<sup>n</sup>')}, נגזרת מסודרת`,
  rule:`${M(`∫ f′(x)·f<sup>n</sup>(x) dx = ${fr('f<sup>n+1</sup>(x)','n+1')} + C`)} &nbsp; בתרגילים כאן הנגזרת כבר מופיעה בדיוק כמו שהיא, בלי תיקון.`,
  ex:[
  {f:x=>2*x*(x*x+1)**2, fx:'2x(x<sup>2</sup> + 1)<sup>2</sup>', q:'חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x והישר x = 1.',
   a:0,b:1, v:[-0.5,1.5,-1,9], val:7/3, ans:'7/3',
   s:[`${M("(x<sup>2</sup> + 1)′ = 2x")}: הביטוי הוא בדיוק ${M('f′·f<sup>2</sup>')}. בתחום ${M('0 ≤ x ≤ 1')} הגרף מעל הציר.`,
      `לפי כלל 3 (n = 2): ${M(`${fr('(x<sup>2</sup> + 1)<sup>3</sup>','3')}`)}`,
      `${M(`S = ${fr('8','3')} − ${fr('1','3')} = ${fr('7','3')}`)}`]},
  {f:x=>2*x/(x*x+1)**2, fx:fr('2x','(x<sup>2</sup> + 1)<sup>2</sup>'), q:'חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x והישר x = 1.',
   a:0,b:1, v:[-0.5,2.5,-0.3,0.9], val:0.5, ans:'1/2',
   s:[`${M(`${fr('2x','(x<sup>2</sup> + 1)<sup>2</sup>')} = 2x·(x<sup>2</sup> + 1)<sup>−2</sup>`)}, ו‑${M("(x<sup>2</sup> + 1)′ = 2x")}`,
      `לפי כלל 3 (n = −2): ${M(`${fr('(x<sup>2</sup> + 1)<sup>−1</sup>','−1')} = −${fr('1','x<sup>2</sup> + 1')}`)}`,
      `${M(`S = −${fr('1','2')} − (−1) = ${fr('1','2')}`)}`]},
  {f:x=>2*x*(x*x-1)**2, fx:'2x(x<sup>2</sup> − 1)<sup>2</sup>', q:`חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x והישר ${M('x = 1.5')}.`,
   a:0,b:1.5, v:[-0.5,2,-0.5,5.5], val:63/64, ans:'63/64', marks:[[1,'1']],
   s:[`חיתוך עם ציר ה‑x: ${M('x = 0')}, והגרף נוגע בציר ב‑${M('x = 1')}. יש שני חלקים, ושניהם מעל הציר.`,
      `${M("(x<sup>2</sup> − 1)′ = 2x")}: הנגזרת מופיעה בדיוק. לפי כלל 3: ${M(`${fr('(x<sup>2</sup> − 1)<sup>3</sup>','3')}`)}`,
      `${M(`S = ${fr('(1.25)<sup>3</sup>','3')} − ${fr('(−1)<sup>3</sup>','3')} = ${fr('125','192')} + ${fr('1','3')} = ${fr('63','64')}`)}`]},
  {f:x=>3*x*x*(x**3+1), fx:'3x<sup>2</sup>(x<sup>3</sup> + 1)', q:'חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x והישר x = 1.',
   a:-1,b:1, v:[-1.5,1.5,-1,7], val:2, ans:'2', marks:[[0,'0']],
   s:[`חיתוך עם ציר ה‑x: ${M('x = −1')}, והגרף נוגע בציר ב‑${M('x = 0')}. שני חלקים, שניהם מעל הציר.`,
      `${M("(x<sup>3</sup> + 1)′ = 3x<sup>2</sup>")}: זה המקרה ${M('f′·f')} (n = 1). ${M(`∫ = ${fr('(x<sup>3</sup> + 1)<sup>2</sup>','2')}`)}`,
      `${M(`S = ${fr('4','2')} − 0 = 2`)}`]},
  {f:x=>(2*x-4)/(x*x-4*x+5)**2, fx:fr('2x − 4','(x<sup>2</sup> − 4x + 5)<sup>2</sup>'), q:'חשבו את השטח המוגבל על ידי גרף הפונקציה, ציר ה‑x והישר x = 4.',
   a:2,b:4, v:[-0.5,5,-0.9,0.9], val:0.8, ans:'4/5',
   s:[`חיתוך עם ציר ה‑x: ${M('2x − 4 = 0 ⇒ x = 2')}. בתחום ${M('2 ≤ x ≤ 4')} הגרף מעל הציר.`,
      `${M("(x<sup>2</sup> − 4x + 5)′ = 2x − 4")}, והביטוי הוא ${M('f′·f<sup>−2</sup>')}.`,
      `לפי כלל 3 (n = −2): ${M(`−${fr('1','x<sup>2</sup> − 4x + 5')}`)}`,
      `${M(`S = −${fr('1','5')} − (−1) = ${fr('4','5')}`)}`]}
 ]},
 {name:`כלל 3ב: ${M('f′·f<sup>n</sup>')}, תיקון הנגזרת`,

  const sx=step(x1-x0), sy=step(y1-y0);
  for(let x=Math.ceil(x0/sx)*sx;x<=x1+1e-9;x+=sx)s+=`<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${Hh}" stroke="var(--grid)"/>`;

  if(y0<=0&&y1>=0)s+=`<line x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}" stroke="var(--axis)" stroke-width="1.6"/>`;
  if(x0<=0&&x1>=0)s+=`<line x1="${X(0)}" y1="0" x2="${X(0)}" y2="${Hh}" stroke="var(--axis)" stroke-width="1.6"/>`;
  s+=`<text x="${W-10}" y="${Y(0)-6}" fill="var(--axis)" font-size="13">x</text>`;
  if(e.Sasy!==undefined)s+=`<line x1="0" y1="${Y(e.Sasy)}" x2="${W}" y2="${Y(e.Sasy)}" stroke="var(--muted)" stroke-dasharray="6 5"/><text x="6" y="${Y(e.Sasy)-5}" fill="var(--muted)" font-size="11">y = ${e.Sasy}</text>`;
  let d='',pen=false;
  for(let i=0;i<=900;i++){const x=x0+(x1-x0)*i/900;const y=e.S(x);if(!isFinite(y)||y>y1+(y1-y0)*2||y<y0-(y1-y0)*2){pen=false;continue}d+=(pen?'L':'M')+X(x).toFixed(2)+' '+Y(y).toFixed(2)+' ';pen=true}
  s+=`<path d="${d}" fill="none" stroke="var(--curve2)" stroke-width="2.6" clip-path="url(#c${id})"/>`;
  e.Sp.forEach(([x,y,l])=>{const ty=Y(y)<20?Y(y)+18:Y(y)-9;s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="3.8" fill="var(--ink)"/><text x="${X(x)}" y="${ty}" fill="var(--ink)" font-size="11.5" font-weight="700" text-anchor="middle">${l}</text>`});
  s+=`<text x="${W-6}" y="14" fill="var(--curve2)" font-size="13" font-weight="700" text-anchor="end">S(x)</text>`;
  return s+'</svg>';
}

SECS.push({tab:'פונקציה צוברת שטח',title:'פונקציה צוברת שטח',rules:ACC});

const NS='http://www.w3.org/2000/svg';
function step(r){const c=[0.1,0.2,0.25,0.5,1,2,5,10,20];for(const s of c){if(r/s<=10)return s}return 50}
function fmt(n){const r=Math.round(n*100)/100;return (r===0.5?'½':r===-0.5?'−½':String(r).replace('-','−'))}
function plot(e,show){
  const W=360,Hh=260,[x0,x1,y0,y1]=e.v;
  const X=x=>(x-x0)/(x1-x0)*W, Y=y=>Hh-(y-y0)/(y1-y0)*Hh;
  let s=`<svg viewBox="0 0 ${W} ${Hh}" xmlns="${NS}" role="img" aria-label="גרף"><defs><clipPath id="c${e.id}"><rect x="0" y="0" width="${W}" height="${Hh}"/></clipPath></defs>`;
  const sx=step(x1-x0), sy=step(y1-y0);
  for(let x=Math.ceil(x0/sx)*sx;x<=x1+1e-9;x+=sx){s+=`<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${Hh}" stroke="var(--grid)" stroke-width="1"/>`}
  for(let y=Math.ceil(y0/sy)*sy;y<=y1+1e-9;y+=sy){s+=`<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}" stroke="var(--grid)" stroke-width="1"/>`}
  const up=e.u||e.f, lo=e.l||e.g2||(()=>0), cl=y=>Math.max(y0-1,Math.min(y1+1,y));let p='';const N=240;
  for(let i=0;i<=N;i++){const x=e.a+(e.b-e.a)*i/N;p+=`${X(x)},${Y(cl(up(x)))} `}
  for(let i=N;i>=0;i--){const x=e.a+(e.b-e.a)*i/N;p+=`${X(x)},${Y(cl(lo(x)))} `}
  const poly=(U,L,fill)=>{let q='';for(let i=0;i<=N;i++){const x=e.a+(e.b-e.a)*i/N;q+=`${X(x)},${Y(cl(U(x)))} `}for(let i=N;i>=0;i--){const x=e.a+(e.b-e.a)*i/N;q+=`${X(x)},${Y(cl(L(x)))} `}return `<polygon points="${q}" fill="${fill}" stroke="none" clip-path="url(#c${e.id})"/>`};
  let g=e.signed?poly(x=>Math.max(e.f(x),0),()=>0,'var(--accent-soft)')+poly(()=>0,x=>Math.min(e.f(x),0),'var(--neg-soft)'):`<polygon points="${p}" fill="var(--accent-soft)" stroke="none" clip-path="url(#c${e.id})"/>`;
  [e.a,e.b].forEach(x=>{const y=up(x),l=lo(x);if(Math.abs(y-l)>1e-9&&(e.g2||Math.abs(x)>1e-9))g+=`<line x1="${X(x)}" y1="${Y(Math.max(y0,Math.min(y1,l)))}" x2="${X(x)}" y2="${Y(Math.max(y0,Math.min(y1,y)))}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>`});
  s+=`<g id="ar${e.id}" style="display:${show?'inline':'none'}">${g}</g>`;
  if(y0<=0&&y1>=0)s+=`<line x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}" stroke="var(--axis)" stroke-width="1.6"/>`;
  if(x0<=0&&x1>=0)s+=`<line x1="${X(0)}" y1="0" x2="${X(0)}" y2="${Hh}" stroke="var(--axis)" stroke-width="1.6"/>`;
  s+=`<text x="${W-10}" y="${Y(0)-6}" fill="var(--axis)" font-size="13">x</text>`;
  if(x0<=0&&x1>=0)s+=`<text x="${X(0)+6}" y="13" fill="var(--axis)" font-size="13">y</text>`;
  if(!e.noticks)for(let x=Math.ceil(x0/sx)*sx;x<=x1+1e-9;x+=sx){if(Math.abs(x)<1e-9||X(x)<8||X(x)>W-14)continue;s+=`<text x="${X(x)}" y="${Math.min(Hh-4,Math.max(12,Y(0)+14))}" fill="var(--muted)" font-size="10" text-anchor="middle">${fmt(x)}</text>`}
  if(!e.noticks)for(let y=Math.ceil(y0/sy)*sy;y<=y1+1e-9;y+=sy){if(Math.abs(y)<1e-9||Y(y)<10||Y(y)>Hh-6)continue;const lx=(x0<=0&&x1>=0)?X(0)-4:W-4;s+=`<text x="${lx}" y="${Y(y)+3}" fill="var(--muted)" font-size="10" text-anchor="end">${fmt(y)}</text>`}
  const path=(fn,col)=>{let d='',pen=false;const M2=900;
  for(let i=0;i<=M2;i++){const x=x0+(x1-x0)*i/M2;const y=fn(x);
    if(!isFinite(y)||y>y1+(y1-y0)*2||y<y0-(y1-y0)*2){pen=false;continue}
    d+=(pen?'L':'M')+X(x).toFixed(2)+' '+Y(y).toFixed(2)+' ';pen=true}
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" clip-path="url(#c${e.id})"/>`};
  s+=path(e.f,'var(--curve)');if(e.g2)s+=path(e.g2,'var(--curve2)');
  (e.lbl||[]).forEach(([x,y,t])=>{s+=`<text x="${X(x)}" y="${Y(y)}" fill="var(--text)" font-size="13" font-weight="700" text-anchor="middle">${t}</text>`});
  const mk=[[e.a,e.la||fmt(e.a)],[e.b,e.lb||fmt(e.b)],...(e.marks||[])];
  let mg='';mk.forEach(([x,l])=>{mg+=`<circle cx="${X(x)}" cy="${Y(0)}" r="3.5" fill="var(--accent)"/><text x="${X(x)}" y="${Y(0)-8}" fill="var(--accent)" font-size="12" font-weight="700" text-anchor="middle">${l}</text>`});
  s+=`<g id="mk${e.id}" style="display:${show?'inline':'none'}">${mg}</g>`;
  return s+'</svg>';
}

let sec=0,cur=0,uid=0;
SECS.forEach(S=>S.rules.forEach(r=>r.ex.forEach(e=>e.id=uid++)));
function render(){
  document.getElementById('ttl').textContent=SECS[sec].title;
  document.getElementById('secs').innerHTML=SECS.map((S,i)=>`<button class="sec ${i===sec?'active':''}" onclick="gs(${i})">${S.tab}</button>`).join('');
  const RULES=SECS[sec].rules;
  document.getElementById('tabs').innerHTML=RULES.map((r,i)=>`<button class="tab ${i===cur?'active':''}" onclick="go(${i})">${r.name}</button>`).join('');
  const r=RULES[cur];
  let h=`<div class="rule"><b>${r.name}</b><div style="margin-top:6px;line-height:2">${r.rule}</div></div>`;
  r.ex.forEach((e,k)=>{
    const show=k<2;
    h+=`<div class="card"><h3>תרגיל ${k+1}${e.par?': '+e.par:''}</h3>
      <div class="fx">${e.disp?M(e.disp):e.gx?`${M('f(x) = '+e.fx)}<br>${M('g(x) = '+e.gx)}`:M(e.top?e.top:'f(x) = '+e.fx)}</div>
      <div style="margin-bottom:10px;line-height:1.9">${e.q.replace(/ ([אבגדהו])\. /g,'<br>$1. ')}</div>
      ${plot(e,show)}
      ${e.top?`<div style="color:var(--muted);font-size:.9rem;margin-top:4px">בשרטוט: גרף הנגזרת ${M("g′(x)")}</div>`:''}${e.cap?`<div style="color:var(--muted);font-size:.9rem;margin-top:4px">${e.cap}</div>`:''}${e.g2?`<div style="font-size:.9rem;margin-top:4px"><span style="color:var(--curve)">━ ${M('f(x)')}</span> &nbsp; <span style="color:var(--curve2)">━ ${e.gl||M('g(x)')}</span></div>`:''}
      ${show?'':`<div class="row"><button class="b g" id="sb${e.id}" onclick="sh(${e.id})">סמן את השטח המבוקש</button></div>`}
      <div class="row"><button class="b g" onclick="tg('hi${e.id}')">רמז</button><button class="b g" onclick="tg('fi${e.id}')">תשובה סופית</button><button class="b g" onclick="tg('so${e.id}')">פתרון מלא</button></div>
      <div class="hint" id="hi${e.id}">${r.hint?r.hint:sec===3?`מצאו את נקודות החיתוך ופצלו את השטח לחלקים, כך שבכל חלק ברור מה מגביל אותו מלמעלה ומלמטה. השתמשו ב${e.h}.`:sec===2?`מצאו את נקודות החיתוך בין הגרפים, קבעו איזו פונקציה עליונה והשתמשו ב${e.h}.`:`השתמשו ב${r.name}. התחילו במציאת נקודות החיתוך עם ציר ה‑x, וסמנו על הגרף את השטח המבוקש.`}${sec===1?(e.mixed?' כאן חלק מהשטח מעל הציר וחלק מתחתיו: פצלו את האינטגרל בנקודת החיתוך.':' האינטגרל ייצא שלילי, והשטח הוא הערך המוחלט שלו.'):''}</div>
      <div class="fin" id="fi${e.id}">תשובה סופית: <span class="ans">${e.ansH||M('S = '+e.ans)}</span>${e.S?plotS(e,'f'):''}</div>
      <div class="sol" id="so${e.id}"><ol>${e.s.map(x=>`<li>${x}</li>`).join('')}</ol><div>תשובה: <span class="ans">${e.ansH||M('S = '+e.ans)}</span></div>${e.S?plotS(e,'s'):''}</div>
    </div>`});
  document.getElementById('main').innerHTML=h;
  fixMath(document.getElementById('main'));fixMath(document.getElementById('tabs'));
}
const MATHRE=/[A-Za-z0-9√½±(][A-Za-z0-9√½±=<>≤≥+\-−.,()·\/′ⁿ ]*[A-Za-z0-9√½)′ⁿ]|[A-Za-z]/g;
function trimParens(t){let o=(t.match(/\(/g)||[]).length,c=(t.match(/\)/g)||[]).length;
  while(o>c&&t[0]==='('){t=t.slice(1);o--} while(c>o&&t[t.length-1]===')'){t=t.slice(0,-1);c--}return t}
function fixMath(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];
  while(w.nextNode()){const n=w.currentNode;if(n.parentElement.closest('.m,svg'))continue;if(/[A-Za-z0-9]/.test(n.nodeValue))ns.push(n)}
  ns.forEach(n=>{const t=n.nodeValue;let last=0,out=document.createDocumentFragment(),m;MATHRE.lastIndex=0;
    while((m=MATHRE.exec(t))){let tok=m[0],st=m.index;const tr=trimParens(tok);st+=tok.indexOf(tr);tok=tr;if(!/[A-Za-z0-9]/.test(tok))continue;
      out.appendChild(document.createTextNode(t.slice(last,st)));const sp=document.createElement('span');sp.className='m';sp.textContent=tok;out.appendChild(sp);last=st+tok.length}
    out.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(out,n)})}
function sh(id){const a=document.getElementById('ar'+id),m=document.getElementById('mk'+id),b=document.getElementById('sb'+id);
  const on=a.style.display==='none';a.style.display=m.style.display=on?'inline':'none';b.textContent=on?'הסתר את הסימון':'סמן את השטח המבוקש'}
function tg(id){const el=document.getElementById(id);el.style.display=el.style.display==='block'?'none':'block'}
function go(i){cur=i;render();window.scrollTo(0,0)}
function gs(i){sec=i;cur=0;render();window.scrollTo(0,0)}
render();
</script>
